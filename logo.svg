<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Icon: stacked desk layers + monitor dot -->
  <g transform="translate(0, 5)">
    <!-- Base/desk surface -->
    <rect x="2" y="38" width="36" height="5" rx="2" fill="#3b82f6"/>
    <!-- Stack layer 1 -->
    <rect x="6" y="30" width="28" height="5" rx="2" fill="#60a5fa"/>
    <!-- Stack layer 2 -->
    <rect x="10" y="22" width="20" height="5" rx="2" fill="#93c5fd"/>
    <!-- Monitor stand -->
    <rect x="17" y="18" width="6" height="5" rx="1" fill="#3b82f6"/>
    <!-- Monitor screen -->
    <rect x="8" y="4" width="24" height="16" rx="2" fill="#3b82f6"/>
    <!-- Monitor screen inner -->
    <rect x="10" y="6" width="20" height="12" rx="1" fill="#1e293b"/>
    <!-- Screen glow dot -->
    <circle cx="20" cy="12" r="3" fill="#60a5fa"/>
  </g>

  <!-- Text: Home Office Stack -->
  <text x="48" y="24" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc" letter-spacing="-0.03em">Home</text>
  <text x="48" y="42" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="-0.01em">OFFICE STACK</text>
</svg>