<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!-- Icon: stacked desk layers + monitor — no text -->
  <!-- Dark background rounded square -->
  <rect width="44" height="44" rx="10" fill="#0f172a"/>
  <!-- Base desk surface -->
  <rect x="5" y="34" width="34" height="5" rx="2" fill="#3b82f6"/>
  <!-- Stack layer 1 -->
  <rect x="9" y="27" width="26" height="5" rx="2" fill="#60a5fa"/>
  <!-- Stack layer 2 -->
  <rect x="13" y="20" width="18" height="5" rx="2" fill="#93c5fd"/>
  <!-- Monitor stand -->
  <rect x="19" y="15" width="6" height="6" rx="1" fill="#3b82f6"/>
  <!-- Monitor screen -->
  <rect x="10" y="4" width="24" height="13" rx="2" fill="#3b82f6"/>
  <!-- Monitor screen inner (dark) -->
  <rect x="12" y="6" width="20" height="9" rx="1" fill="#1e293b"/>
  <!-- Screen glow dot -->
  <circle cx="22" cy="10.5" r="2.5" fill="#60a5fa"/>
</svg>
